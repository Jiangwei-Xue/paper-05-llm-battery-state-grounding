[project]
name = "energy-agent-reliability"
version = "0.1.0"
description = "Public-data and physics-simulation substrate for energy-agent reliability research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cvxpy>=1.6.0",
  "highspy>=1.9.0",
  "httpx[socks]>=0.27.0",
  "jsonschema>=4.23.0",
  "matplotlib>=3.9.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "pvlib>=0.11.0",
  "pyarrow>=17.0.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.0",
  "scipy>=1.14.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pandas-stubs>=2.2.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "types-jsonschema>=4.23.0",
  "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_agent_reliability", "src/energybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cvxpy", "cvxpy.*", "pvlib", "pvlib.*"]
follow_imports = "skip"
